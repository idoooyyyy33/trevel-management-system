[build]
  command = "npm run build"
  publish = "dist"

# API ditangani oleh Netlify Server (netlify/server/index.ts) pada /api/*.
# SPA fallback dibatasi hanya untuk rute halaman agar tidak menelan /api/*.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
